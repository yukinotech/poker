[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-cli"
version = "0.1.0"
description = "A simple heads-up Texas Hold'em game for the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "yukinotech" }]

[project.scripts]
poker = "poker.cli:main"

[tool.setuptools.packages.find]
include = ["poker*"]
